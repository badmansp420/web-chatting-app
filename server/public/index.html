<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Websocket</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=send" />
</head>

<body class="body" style="margin: 0; padding: 0; font-family: Arial, sans-serif;">
    <header class="header" style="text-align: center; padding: 10px; background-color: #f1f1f1; ">
        <h2 class="title" style="font-size: 24px; font-weight: bold;">Chatting App</h2>
    </header>

    <main class="main">
        <div class="message-container">

            <h3 class="message-title">Messages</h3>
            <div id="messages" class="messages">
                <ul id="message-list" class="message-list">

                </ul>

            </div>

            <!-- here is input group  -->
            <div class="input-container">
                <input type="text" id="message" placeholder="Enter your message" style="width: 70%; padding: 10px;">
                <button onclick="sendMessage()" class="send-button">
                    <span class="material-symbols-outlined">
                        send
                    </span>
                </button>
            </div>
        </div>



    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const messageInput = document.getElementById('message');
        const messages = document.getElementById('message-list');

        const sendMessage = () => {
            const message = messageInput.value;
            socket.emit('message', message);
            messageInput.value = '';
        }


        socket.on('message', (message) => {
            console.log(message);
            appendMessage(message);
        });

        const appendMessage = (message) => {
            const messageElement = document.createElement('li');
            messageElement.innerText = message;
            messages.appendChild(messageElement);
        }
    </script>
</body>

</html>
